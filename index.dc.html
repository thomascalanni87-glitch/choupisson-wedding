<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    @keyframes gridScroll { from { background-position: 0 0; } to { background-position: 0 60px; } }
    @keyframes floorNear { from { background-position: 0 0; } to { background-position: 0 160px; } }
    @keyframes floorFar { from { background-position: 0 0; } to { background-position: 0 320px; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
  </style>
</helmet>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#c98a8f"></rect><text x="50" y="62" font-size="34" font-family="sans-serif" font-weight="700" fill="#faf3ea" text-anchor="middle">CW</text></svg>
</template>

<div style="{{ rootStyle }}">

  <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:64px 24px 120px; position:relative; overflow:hidden;">

    <div style="{{ synthLayerStyle }}">
      <div style="position:absolute; inset:0; overflow:hidden; background:linear-gradient(180deg, #14062b 0%, #1c0733 20%, #5a1279 52%, #a3216f 66%, #ff5c8a 70%);">
        <div style="position:absolute; left:50%; top:70vh; width:min(26vh,215px); height:min(26vh,215px); transform:translate(-50%,-66%); border-radius:50%; background:linear-gradient(180deg,#ffe36b 0%,#ff8a3d 52%,#ff2fb0 100%); box-shadow:0 0 90px 30px rgba(255,90,150,0.35); overflow:hidden;">
          <div style="position:absolute; left:0; right:0; bottom:0; height:62%; background:repeating-linear-gradient(180deg, rgba(28,7,51,0.92) 0 6px, transparent 6px 22px);"></div>
        </div>
        <div style="position:absolute; left:0; right:0; top:70vh; bottom:0; overflow:hidden; background:#160427; perspective:400px; perspective-origin:50% 0%;">
          <div style="position:absolute; left:-90%; right:-90%; bottom:0; height:2000px; transform-origin:50% 100%; transform:rotateX(60deg); background-image:linear-gradient(rgba(0,229,255,0.85) 6px, transparent 6px), linear-gradient(90deg, rgba(255,47,176,0.7) 6px, transparent 6px); background-size:160px 160px; backface-visibility:hidden; animation: floorNear 7s linear infinite;"></div>
          <div style="position:absolute; left:-90%; right:-90%; bottom:0; height:2000px; transform-origin:50% 100%; transform:rotateX(60deg); background-image:linear-gradient(rgba(255,47,176,0.28) 5px, transparent 5px); background-size:320px 320px; backface-visibility:hidden; filter:blur(0.5px); animation: floorFar 12s linear infinite;"></div>
          <div style="position:absolute; left:0; right:0; top:0; height:2px; background:#00e5ff; box-shadow:0 0 18px 5px rgba(0,229,255,0.65);"></div>
        </div>
      </div>
    </div>

    <div style="width:120px; height:120px; margin-bottom:20px; position:relative; z-index:1;">
      <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="choupisson-logo" shape="circle" placeholder="Logo Choupisson" hint-size="120px,120px" style="width:120px; height:120px; border-radius:50%; border:3px solid var(--accent); box-shadow: 0 8px 24px var(--shadow);"></x-import>
    </div>

    <h1 style="font-family:'Cormorant Garamond',serif; font-weight:500; font-size:66px; color:var(--text); margin:0 0 6px; text-align:center; letter-spacing:2px; position:relative; z-index:1;">
      Choupisson Wedding
    </h1>
    <p style="font-family:'Nunito',sans-serif; font-size:18px; color:var(--text-soft); margin:0 0 56px; text-align:center; position:relative; z-index:1;">Charlotte &amp; Thomas&nbsp;se marient — deux fois !</p>

    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:32px; width:100%; max-width:920px; position:relative; z-index:1;">

      <a href="civil.dc.html" style="flex:1 1 320px; min-width:280px; max-width:420px; text-decoration:none; display:block;">
        <div style="background:var(--card-bg); border-radius:24px; padding:40px 32px; text-align:center; box-shadow:0 10px 30px var(--shadow); border:1px solid var(--card-border); transition:transform 0.2s, background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;" style-hover="transform:translateY(-4px);">
          <div style="font-size: 70px; margin-bottom: 12px">🎄</div>
          <div style="font-family: 'Caveat',cursive; font-size: 40px; color: var(--accent); margin-bottom: 4px">Le civil</div>
          
          <div style="font-family:'Caveat',cursive; font-weight:700; font-size:52px; line-height:1.05; color:var(--accent); margin-bottom:24px;">5 décembre 2026</div>
          <div style="font-family:'Nunito',sans-serif; font-size:40px; font-weight:700; color:var(--text-soft); line-height:1.1;">{{ daysCivil }}</div>
          <div style="font-family:'Nunito',sans-serif; font-size:13px; color:var(--text-soft); text-transform:uppercase; letter-spacing:1px;">jours restants</div>
        </div>
      </a>

      <a href="{{ religieuxHref }}" style="{{ religieuxLinkStyle }}">
        <div style="{{ religieuxCardStyle }}">
          <sc-if value="{{ religieuxLocked }}" hint-placeholder-val="{{ true }}">
            <div style="position:absolute; inset:0; overflow:hidden; border-radius:24px; pointer-events:none; z-index:2;">
              <div style="position:absolute; top:2%; left:-52%; width:160%; transform:rotate(-18deg); background:linear-gradient(90deg,#8a7a6d,#5f524a); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; letter-spacing:6px; text-align:center; padding:12px 0; box-shadow:0 6px 18px rgba(0,0,0,0.25);">BIENTÔT</div>
            </div>
          </sc-if>
          <div style="font-size: 70px; margin-bottom: 12px">🏖️</div>
          <div style="font-family: 'Caveat',cursive; font-size: 40px; color: var(--accent-2); margin-bottom: 4px">Le religieux</div>
          
          <div style="font-family:'Caveat',cursive; font-weight:700; font-size:52px; line-height:1.05; color:var(--accent-2); margin-bottom:24px;">3 avril 2027</div>
          <div style="font-family:'Nunito',sans-serif; font-size:40px; font-weight:700; color:var(--text-soft); line-height:1.1;">{{ daysReligieux }}</div>
          <div style="font-family:'Nunito',sans-serif; font-size:13px; color:var(--text-soft); text-transform:uppercase; letter-spacing:1px;">jours restants</div>
        </div>
      </a>

    </div>

    <button onClick="{{ toggleSynthwave }}" style="{{ synthButtonStyle }}">
      {{ synthLabel }}
    </button>

    <p style="font-family:'Nunito',sans-serif; font-size:12px; color:var(--text-soft); opacity:0.7; margin-top:48px; text-align:center; max-width:420px; position:relative; z-index:1;">
      Logo à venir — glissez une image ci-dessus pour la remplacer.
    </p>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { synthwave: false };

  componentDidMount() {
    try {
      const saved = localStorage.getItem('choupisson-synthwave');
      if (saved === '1') this.setState({ synthwave: true });
    } catch (e) {}
  }

  toggleSynthwave = () => {
    this.setState((s) => {
      const next = !s.synthwave;
      try { localStorage.setItem('choupisson-synthwave', next ? '1' : '0'); } catch (e) {}
      return { synthwave: next };
    });
  };

  daysUntil(dateStr) {
    const now = new Date();
    const target = new Date(dateStr);
    const ms = target.setHours(0,0,0,0) - new Date(now).setHours(0,0,0,0);
    return Math.max(0, Math.ceil(ms / 86400000));
  }

  renderVals() {
    const synthwave = this.state.synthwave;

    const vars = synthwave ? {
      '--bg': '#170a2e',
      '--text': '#f5e9ff',
      '--text-soft': '#c9a8ff',
      '--accent': '#ff2fb0',
      '--accent-2': '#00e5ff',
      '--card-bg': 'rgba(12,4,28,0.72)',
      '--card-border': 'rgba(0,229,255,0.35)',
      '--shadow': 'rgba(255,47,176,0.35)',
      '--grid-line': 'rgba(0,229,255,0.5)',
    } : {
      '--bg': '#faf3ea',
      '--text': '#3f332c',
      '--text-soft': '#8a7a6d',
      '--accent': '#c98a8f',
      '--accent-2': '#8ea37e',
      '--card-bg': '#ffffff',
      '--card-border': '#efe3d6',
      '--shadow': 'rgba(63,51,44,0.10)',
      '--grid-line': 'rgba(0,0,0,0)',
    };

    const rootStyle = {
      ...vars,
      background: 'var(--bg)',
      minHeight: '100vh',
      transition: 'background 0.7s ease',
    };

    const synthLayerStyle = {
      position: 'fixed', inset: 0, pointerEvents: 'none', overflow: 'hidden',
      opacity: synthwave ? 1 : 0,
      transition: 'opacity 0.7s ease',
    };

    const synthButtonStyle = {
      position: 'relative',
      zIndex: 3,
      marginTop: '40px',
      alignSelf: 'center',
      fontFamily: 'Nunito, sans-serif',
      fontSize: '12px',
      fontWeight: 700,
      letterSpacing: '0.5px',
      padding: '9px 16px',
      borderRadius: '999px',
      border: synthwave ? '1px solid #00e5ff' : '1px solid #d8c9b8',
      background: synthwave ? 'rgba(0,229,255,0.08)' : '#ffffff',
      color: synthwave ? '#00e5ff' : '#8a7a6d',
      cursor: 'pointer',
      boxShadow: synthwave ? '0 0 16px rgba(255,47,176,0.4)' : '0 2px 8px rgba(0,0,0,0.06)',
      transition: 'background 0.7s ease, color 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease',
    };

    const palm = (x, scale, flip) => React.createElement('g', {
      key: 'palm' + x, transform: `translate(${x} 640) scale(${flip ? -scale : scale} ${scale})`
    },

      React.createElement('path', { d: 'M 0 0 Q -6 -70 -16 -130 Q -12 -132 -6 -130 Q 2 -70 8 0 Z', fill: '#1b0733' }),
      React.createElement('path', { d: 'M -16 -132 Q -60 -160 -92 -142 Q -58 -178 -14 -142 Z', fill: '#1b0733' }),
      React.createElement('path', { d: 'M -16 -132 Q -46 -186 -12 -212 Q -20 -172 -8 -138 Z', fill: '#1b0733' }),
      React.createElement('path', { d: 'M -14 -134 Q 26 -184 62 -170 Q 20 -178 -8 -138 Z', fill: '#1b0733' }),
      React.createElement('path', { d: 'M -14 -132 Q 34 -140 66 -110 Q 26 -132 -8 -126 Z', fill: '#1b0733' })
    );

    const hog = (x, y, s, veil) => React.createElement('g', { transform: `translate(${x} ${y}) scale(${s})` },
      React.createElement('ellipse', { cx: 0, cy: 0, rx: 40, ry: 30, fill: '#2d0f4d', stroke: '#ff2fb0', strokeWidth: 2.5 }),
      React.createElement('path', { d: 'M -34 -14 L -26 -46 L -16 -12 Z M -18 -20 L -8 -56 L 2 -20 Z M 0 -22 L 12 -58 L 22 -20 Z M 20 -18 L 34 -48 L 40 -12 Z', fill: '#3d1466', stroke: '#00e5ff', strokeWidth: 1.6 }),
      React.createElement('ellipse', { cx: 0, cy: 8, rx: 24, ry: 18, fill: '#4a1d73' }),
      React.createElement('rect', { x: -22, y: -2, width: 44, height: 12, rx: 3, fill: '#0b0217', stroke: '#00e5ff', strokeWidth: 1.6 }),
      React.createElement('line', { x1: 0, y1: -2, x2: 0, y2: 10, stroke: '#00e5ff', strokeWidth: 1.4 }),
      React.createElement('ellipse', { cx: 0, cy: 18, rx: 4, ry: 3, fill: '#ff2fb0' }),
      veil
        ? React.createElement('path', { d: 'M -30 -34 Q 0 -66 30 -34 Q 40 6 22 30 Q 0 -6 -22 30 Q -40 6 -30 -34 Z', fill: 'rgba(255,255,255,0.16)', stroke: '#f5e9ff', strokeWidth: 1.4 })
        : React.createElement('path', { d: 'M -14 30 L 0 22 L 14 30 L 0 38 Z', fill: '#ff2fb0', stroke: '#00e5ff', strokeWidth: 1.4 })
    );

    const synthSceneUnused = React.createElement('svg', {
      viewBox: '0 0 1200 900', preserveAspectRatio: 'xMidYMid slice',
      style: { position: 'absolute', inset: 0, width: '100%', height: '100%' }
    },
      React.createElement('defs', null,
        React.createElement('linearGradient', { id: 'sky', x1: '0', y1: '0', x2: '0', y2: '1' },
          React.createElement('stop', { offset: '0%', stopColor: '#1a0733' }),
          React.createElement('stop', { offset: '55%', stopColor: '#57127a' }),
          React.createElement('stop', { offset: '100%', stopColor: '#c02a86' })
        ),
        React.createElement('linearGradient', { id: 'sun', x1: '0', y1: '0', x2: '0', y2: '1' },
          React.createElement('stop', { offset: '0%', stopColor: '#ffe36b' }),
          React.createElement('stop', { offset: '50%', stopColor: '#ff8a3d' }),
          React.createElement('stop', { offset: '100%', stopColor: '#ff2fb0' })
        ),
        React.createElement('clipPath', { id: 'sunClip' },
          React.createElement('circle', { cx: 600, cy: 470, r: 120 })
        )
      ),
      React.createElement('rect', { width: 1200, height: 900, fill: 'url(#sky)' }),
      React.createElement('circle', { cx: 600, cy: 470, r: 120, fill: 'url(#sun)' }),
      React.createElement('g', { clipPath: 'url(#sunClip)' },
        [0, 1, 2, 3, 4, 5].map((i) => React.createElement('rect', {
          key: 'sc' + i, x: 460, y: 492 + i * 20, width: 280, height: 5 + i * 2, fill: '#57127a', opacity: 0.85
        }))
      ),
      React.createElement('rect', { x: 0, y: 580, width: 1200, height: 320, fill: '#180528' })
    );

    void synthSceneUnused;

    const daysCivil = this.daysUntil('2026-12-05');
    const religieuxLocked = daysCivil > 0;

    return {
      synthLayerStyle,
      religieuxLocked,
      religieuxHref: religieuxLocked ? undefined : 'religieux.dc.html',
      religieuxLinkStyle: {
        flex: '1 1 320px', minWidth: '280px', maxWidth: '420px', textDecoration: 'none', display: 'block',
        cursor: religieuxLocked ? 'not-allowed' : 'pointer',
        pointerEvents: religieuxLocked ? 'none' : 'auto',
      },
      religieuxCardStyle: {
        position: 'relative',
        background: 'var(--card-bg)', borderRadius: '24px', padding: '40px 32px', textAlign: 'center',
        boxShadow: '0 10px 30px var(--shadow)', border: '1px solid var(--card-border)',
        transition: 'transform 0.2s, background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease, filter 0.7s ease, opacity 0.7s ease',
        filter: religieuxLocked ? 'grayscale(0.7) saturate(0.5) brightness(1.06) contrast(0.9)' : 'none',
        opacity: religieuxLocked ? 0.7 : 1,
      },
      synthwave,
      toggleSynthwave: this.toggleSynthwave,
      rootStyle,
      synthButtonStyle,
      synthLabel: synthwave ? '✦ Mode Synthwave: ON' : 'Mode Synthwave',
      daysCivil: this.daysUntil('2026-12-05'),
      daysReligieux: this.daysUntil('2027-04-03'),
    };
  }
}

</script>
</body>
</html>
